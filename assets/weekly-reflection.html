<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光 · 一周工作回想</title>
  <style>
    :root {
      --paper: #f2eee5;
      --ink: #25302a;
      --muted: #69736d;
      --faint: #979d98;
      --line: rgba(37, 48, 42, .13);
      --card: rgba(255, 253, 248, .86);
      --moss: #537166;
      --moss-soft: #dbe6df;
      --apricot: #c47f5c;
      --lavender: #766d91;
      --shadow: 0 20px 55px rgba(50, 44, 35, .08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); color-scheme: light; }
    body {
      margin: 0;
      min-width: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(255,255,255,.88), transparent 30%),
        radial-gradient(circle at 92% 12%, rgba(214,173,87,.11), transparent 24%),
        linear-gradient(135deg, rgba(83,113,102,.03) 25%, transparent 25%) 0 0 / 32px 32px,
        var(--paper);
    }
    .shell { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0 54px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 42px; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: Georgia, "Songti SC", serif; font-size: 20px; letter-spacing: .06em; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: rgba(255,255,255,.5); }
    .brand-mark::before { content: ""; width: 12px; height: 12px; border-radius: 50% 50% 50% 4px; background: var(--moss); transform: rotate(-35deg); }
    .privacy { color: var(--muted); font-size: 13px; }
    .privacy::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #71a27f; box-shadow: 0 0 0 4px rgba(113,162,127,.13); }
    .hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, .55fr); gap: 28px; align-items: end; }
    .eyebrow { margin: 0 0 14px; color: var(--apricot); font-size: 12px; font-weight: 750; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(38px, 5vw, 66px); font-weight: 500; line-height: 1.16; letter-spacing: -.03em; }
    .headline { max-width: 900px; margin: 18px 0 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(18px, 2vw, 23px); line-height: 1.55; color: #3e4943; }
    .note { max-width: 900px; margin: 9px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .identity { padding: 20px 22px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.38); }
    .identity small { display: block; margin-bottom: 7px; color: var(--faint); }
    .identity strong { display: block; font-family: Georgia, "Songti SC", serif; font-size: 25px; font-weight: 500; overflow-wrap: anywhere; }
    .identity span { display: block; margin-top: 7px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 28px 0 18px; }
    .metric { padding: 18px 20px; border: 1px solid rgba(255,255,255,.76); border-radius: 20px; background: var(--card); box-shadow: 0 12px 34px rgba(50,44,35,.05); }
    .metric-label { color: var(--muted); font-size: 13px; }
    .metric-value { margin: 7px 0 2px; font-family: Georgia, "Songti SC", serif; font-size: 29px; }
    .metric-caption { color: var(--faint); font-size: 12px; }
    .themes { display: flex; flex-wrap: wrap; gap: 9px; margin: 0 0 24px; }
    .theme { padding: 7px 11px; border-radius: 999px; background: var(--moss-soft); color: #39564c; font-size: 12px; font-weight: 650; }
    .week-panel { overflow: hidden; border: 1px solid rgba(255,255,255,.78); border-radius: 26px; background: var(--card); box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 23px 25px 19px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 24px; font-weight: 500; }
    .panel-head p { margin: 6px 0 0; color: var(--faint); font-size: 12px; line-height: 1.5; }
    .status { color: var(--moss); font-size: 12px; font-weight: 700; }
    .table-wrap { width: 100%; overflow-x: hidden; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    col.date { width: 15%; }
    col.summary { width: 25%; }
    col.result { width: 44%; }
    col.evidence { width: 16%; }
    th { padding: 13px 18px; color: var(--faint); background: rgba(83,113,102,.045); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-align: left; }
    td { padding: 18px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
    tbody tr:first-child td { border-top: 0; }
    tbody tr:hover { background: rgba(255,255,255,.38); }
    .date-main { font-family: Georgia, "Songti SC", serif; font-size: 20px; line-height: 1.25; }
    .date-sub { margin-top: 5px; color: var(--faint); font-size: 11px; }
    .day-summary { margin: 0; font-weight: 720; line-height: 1.55; }
    .day-themes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .day-theme { padding: 4px 8px; border-radius: 999px; background: rgba(118,109,145,.12); color: #625a7c; font-size: 10px; }
    .results { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .results li { display: grid; grid-template-columns: 17px minmax(0,1fr); gap: 7px; color: #3e4943; font-size: 13px; line-height: 1.52; }
    .results li::before { content: "↗"; color: var(--moss); }
    .empty { color: var(--faint); font-size: 13px; line-height: 1.55; }
    .evidence-count { font-family: Georgia, "Songti SC", serif; font-size: 23px; }
    .evidence-meta { margin-top: 5px; color: var(--faint); font-size: 10px; line-height: 1.5; }
    .footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .footer em { color: var(--apricot); font-family: Georgia, "Songti SC", serif; font-style: normal; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 22px, 1480px); padding-top: 22px; }
      .topbar { margin-bottom: 30px; }
      .privacy { display: none; }
      .hero { grid-template-columns: 1fr; }
      .identity { max-width: 420px; }
      .metrics { grid-template-columns: 1fr; }
      .metric { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; }
      .metric-value { grid-row: span 2; grid-column: 2; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { padding: 18px; border-top: 1px solid var(--line); }
      tbody tr:first-child { border-top: 0; }
      td { padding: 0; border: 0; }
      td + td { margin-top: 15px; }
      td::before { display: block; margin-bottom: 5px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
      td:nth-child(2)::before { content: "工作主题"; }
      td:nth-child(3)::before { content: "关键结果"; }
      td:nth-child(4)::before { content: "线索"; }
      .footer { flex-direction: column; }
    }
  </style>
</head>
<body data-report-kind="weekly">
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><span>拾光</span></div>
      <div class="privacy">只在本地 · 周维度精炼回想</div>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">Private weekly reflection</p>
        <h1 id="title">一周工作回想</h1>
        <p class="headline" id="headline">这一周留下了一些线索。</p>
        <p class="note" id="note">这是数字线索摘要，不是完整工时记录。</p>
      </div>
      <aside class="identity">
        <small>这是谁的一周</small>
        <strong id="person">—</strong>
        <span id="period">—</span>
        <span id="sourceStatus">—</span>
      </aside>
    </section>

    <section class="metrics" aria-label="一周概览">
      <article class="metric"><div class="metric-label">数字脚印</div><div class="metric-value" id="eventCount">0</div><div class="metric-caption">跨主机合并去重后的线索</div></article>
      <article class="metric"><div class="metric-label">有可见线索的日期</div><div class="metric-value" id="activeDays">0</div><div class="metric-caption">没有线索不等于没有工作</div></article>
      <article class="metric"><div class="metric-label">采集主机</div><div class="metric-value" id="hostCount">0/0</div><div class="metric-caption">成功采集 / 清单主机</div></article>
    </section>

    <div class="themes" id="themes" aria-label="整周主题"></div>

    <section class="week-panel">
      <header class="panel-head">
        <div><h2>周一到周日</h2><p>每天只保留精炼主题与关键结果；原始对话不会进入页面。</p></div>
        <span class="status" id="status">—</span>
      </header>
      <div class="table-wrap">
        <table aria-label="一周工作总结">
          <colgroup><col class="date"><col class="summary"><col class="result"><col class="evidence"></colgroup>
          <thead><tr><th>日期</th><th>工作主题</th><th>关键结果</th><th>线索概况</th></tr></thead>
          <tbody id="weekRows"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <span>Codex 是任务运行窗口，Git 是提交时间点；两者都不等于完整工时。</span>
      <em>一周先看脉络，再决定哪些细节值得补充。</em>
    </footer>
  </main>

  <script>
    const payload = __REFLECT_WORKDAY_DATA__;
    const evidence = payload.evidence || {};
    const reflection = payload.reflection || {};
    const events = Array.isArray(evidence.events) ? evidence.events : [];
    const days = Array.isArray(reflection.days) ? reflection.days : [];
    const hosts = Array.isArray(evidence.sources?.hosts) ? evidence.sources.hosts : [];
    const dateKey = value => String(value || "").match(/^\d{4}-\d{2}-\d{2}/)?.[0] || "";
    const formatDay = value => new Intl.DateTimeFormat("zh-CN", {month:"long", day:"numeric", weekday:"long", timeZone:"UTC"}).format(new Date(`${value}T12:00:00Z`));
    const formatRange = () => {
      const start = dateKey(evidence.period?.start_inclusive);
      const exclusive = new Date(`${dateKey(evidence.period?.end_exclusive)}T12:00:00Z`);
      exclusive.setUTCDate(exclusive.getUTCDate() - 1);
      const end = `${exclusive.getUTCFullYear()}-${String(exclusive.getUTCMonth()+1).padStart(2,"0")}-${String(exclusive.getUTCDate()).padStart(2,"0")}`;
      return `${start} — ${end}`;
    };
    const escapeHTML = value => String(value ?? "").replace(/[&<>'"]/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[character]));
    const eventsForDay = day => events.filter(event => dateKey(event.start) === day);
    const sourceCopy = rows => {
      const codex = rows.filter(event => event.source === "codex").length;
      const git = rows.filter(event => event.source === "git").length;
      return [codex ? `Codex ${codex}` : "", git ? `Git ${git}` : ""].filter(Boolean).join(" · ") || "无可见线索";
    };

    document.getElementById("title").textContent = `${formatRange()} · 一周工作回想`;
    document.getElementById("headline").textContent = reflection.headline || "这一周留下了一些线索。";
    document.getElementById("note").textContent = reflection.note || "这是数字线索摘要，不是完整工时记录。";
    document.getElementById("person").textContent = evidence.person?.display_name || "我";
    document.getElementById("period").textContent = `${formatRange()} · ${evidence.period?.timezone || "本地时区"}`;
    const collectedHosts = hosts.filter(host => host.status === "collected").length;
    document.getElementById("sourceStatus").textContent = hosts.length ? `多机采集：${collectedHosts}/${hosts.length} 台成功` : "本机采集";
    document.getElementById("eventCount").textContent = events.length;
    document.getElementById("activeDays").textContent = days.filter(day => eventsForDay(day.date).length).length;
    document.getElementById("hostCount").textContent = hosts.length ? `${collectedHosts}/${hosts.length}` : "1/1";
    document.getElementById("status").textContent = evidence.collection_status === "partial" ? "部分主机未采集" : evidence.collection_status === "failed" ? "采集失败" : "线索已合并去重";

    const themes = Array.isArray(reflection.themes) ? reflection.themes : [];
    document.getElementById("themes").innerHTML = themes.map(theme => `<span class="theme">${escapeHTML(theme)}</span>`).join("");
    document.getElementById("weekRows").innerHTML = days.map(day => {
      const rows = eventsForDay(day.date);
      const themes = Array.isArray(day.themes) ? day.themes : [];
      const results = Array.isArray(day.results) ? day.results : [];
      return `<tr class="week-row" data-week-day="${escapeHTML(day.date)}">
        <td><div class="date-main">${escapeHTML(formatDay(day.date))}</div><div class="date-sub">${escapeHTML(day.date)}</div></td>
        <td><p class="day-summary">${escapeHTML(day.summary)}</p>${themes.length ? `<div class="day-themes">${themes.map(theme => `<span class="day-theme">${escapeHTML(theme)}</span>`).join("")}</div>` : ""}</td>
        <td>${results.length ? `<ul class="results">${results.map(result => `<li>${escapeHTML(result)}</li>`).join("")}</ul>` : `<span class="empty">暂无可见结果</span>`}</td>
        <td><div class="evidence-count">${rows.length}</div><div class="evidence-meta">${escapeHTML(sourceCopy(rows))}</div></td>
      </tr>`;
    }).join("");
  </script>
</body>
</html>
